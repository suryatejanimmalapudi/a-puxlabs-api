spring.application.name=apuxlabs-api
spring.profiles.default=local

server.port=${PORT:8080}

spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

# Use file: prefix for an absolute path or classpath: if it's inside resources.
# Leave empty on Cloud Run; it uses the attached service account through ADC.
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:apuxlabs}
spring.cloud.gcp.credentials.location=${GCP_CREDENTIALS_LOCATION:}

# Custom property for the bucket name
gcp.bucket.name=${GCP_BUCKET_NAME:apux-labs-pdf-bucket}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}
app.report-download-token-ttl-minutes=${REPORT_DOWNLOAD_TOKEN_TTL_MINUTES:5}
app.report-download-rate-limit-per-minute=${REPORT_DOWNLOAD_RATE_LIMIT_PER_MINUTE:10}
app.report-download-rate-limit-cleanup-ms=${REPORT_DOWNLOAD_RATE_LIMIT_CLEANUP_MS:3600000}

# Google OAuth 2.0 resource-server settings. Set GOOGLE_CLIENT_ID in the runtime environment.
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
