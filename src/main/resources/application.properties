spring.application.name=apuxlabs-api

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:5432/mydatabase

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=250MB

spring.cloud.gcp.project-id=apuxlabs
# Use file: prefix for an absolute path or classpath: if it's inside resources
#TODO: do not store credts in code. Save it in some kind of vault and pass it through jenkins
spring.cloud.gcp.credentials.location=

# Custom property for your bucket name
gcp.bucket.name=apux-labs-pdf-bucket
app.public-base-url=${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}
app.report-download-token-ttl-minutes=${REPORT_DOWNLOAD_TOKEN_TTL_MINUTES:5}

# Google OAuth 2.0 resource-server settings. Set GOOGLE_CLIENT_ID in the runtime environment.
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
