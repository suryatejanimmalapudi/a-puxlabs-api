# Production values must be supplied by the Cloud Run environment or Secret Manager.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.url=${SPRING_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SPRING_FLYWAY_USER:${spring.datasource.username}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

spring.cloud.gcp.project-id=${GCP_PROJECT_ID}
spring.cloud.gcp.credentials.location=
gcp.bucket.name=${GCP_BUCKET_NAME}
google.oauth2.client-id=${GOOGLE_CLIENT_ID}
app.public-base-url=${APP_PUBLIC_BASE_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
